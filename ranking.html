<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- TP2: ranking.js cambia el título según la liga elegida -->
  <title>Clasificación | LingoWeb</title>  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/card.css" />
  <link rel="stylesheet" href="css/forms-buttons.css" />
  <link rel="stylesheet" href="css/footer.css" />
</head>

<body>
  <header class="barra-navegacion">
    <a href="dashboard.html" class="logo"> LingoWeb </a>

    <input type="checkbox" id="menu-toggle" class="menu-toggle" />
    <label for="menu-toggle" class="boton-hamburguesa" aria-label="Abrir menú de navegación">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <nav aria-label="Navegación principal">
      <a href="dashboard.html"> Cursos </a>

      <a href="perfil.html"> Perfil </a>

      <a href="ranking.html" class="activo"> Clasificación </a>

      <a href="tienda.html"> Tienda / Rachas </a>

      <a href="login.html" class="enlace-salir"> Salir </a>
    </nav>
  </header>

  <main>
    <section class="ranking">
      <header class="ranking-header">
        <h1>🏆 Tabla de Clasificación</h1>

        <nav class="selector-ligas" aria-label="Selector de Ligas">
          <!-- TP2: selector de liga. Las tres opciones abren esta MISMA página con la liga en la dirección
               (ranking.html?liga=Plata) y ranking.js arma la tabla de esa liga y marca la pestaña elegida.
               Reemplaza a las páginas rankingPlata.html y rankingOro.html. -->
          <a href="ranking.html?liga=Bronce" class="tab-liga" data-liga="Bronce">🥉 Liga Bronce</a>
          <a href="ranking.html?liga=Plata" class="tab-liga" data-liga="Plata">🥈 Liga Plata</a>
          <a href="ranking.html?liga=Oro" class="tab-liga" data-liga="Oro">🥇 Liga Oro</a>
        </nav>

        <!-- TP2: ranking.js escribe el nombre de la liga elegida y la indicación de ascenso o permanencia -->
        <h2 id="nombre-liga">Liga</h2>
        <p id="info-liga"></p>
      </header>

      <div class="ranking-table-container">
        <table class="tabla-clasificacion">
          <thead>
            <tr>
              <th>Puesto</th>
              <th>Avatar</th>
              <th>Estudiante</th>
              <th>XP Semanal</th>
              <th>Estado</th>
            </tr>
          </thead>
          <!-- Aca inyecta los datos ranking.js -->
          <tbody id="cuerpo-ranking">
          </tbody>
        </table>
      </div>
    </section>
  </main>


  <script type="module" src="./js/presentacion/ranking.js"></script>
</body>

</html>
