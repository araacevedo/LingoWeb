<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | LingoWeb</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header class="encabezado-login">

        <div class="marca">

            <div class="imagotipo">
                LW
            </div>

            <div>
                <h1>LingoWeb</h1>
                <p>Aprende idiomas de forma divertida</p>
            </div>

        </div>

    </header>


    <main class="contenedor-login">

        <section class="tarjeta-login">

            <h2>Recuperar contraseña</h2>

            <p>
                Ingresa tu usuario o correo electrónico y te enviaremos
                instrucciones para recuperar tu contraseña.
            </p>

            <form>

                <div class="campo">

                    <label for="email">
                        Usuario / Email:
                    </label>

                    <input type="email" id="email" name="email" placeholder="Ingresa tu email" required>

                </div>


                <button type="submit">
                    Enviar instrucciones
                </button>

            </form>


            <p class="enlace-secundario">

                <a href="login.html">
                    Volver al inicio de sesión
                </a>

            </p>

        </section>

    </main>

</body>

</html>
