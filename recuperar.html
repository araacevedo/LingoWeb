<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contraseña | LingoWeb</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/card.css" />
  <link rel="stylesheet" href="css/forms-buttons.css" />
  <link rel="stylesheet" href="css/footer.css" />
</head>

<body>
  <header class="encabezado">
    <div class="marca">
      <div class="imagotipo">LW</div>

      <div>
        <h1>LingoWeb</h1>
        <p>Aprende idiomas de forma divertida</p>
      </div>
    </div>
  </header>

 <main class="contenedor">
    <section class="tarjeta">
      <h2>Recuperar contraseña</h2>

      <p class="texto-bienvenida">
        Ingresa tu correo electrónico para solicitar instrucciones de
        recuperación.
      </p>

      <form id="form-recuperar">
        <div class="campo">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="Ingresa tu email" required />
        </div>

        <button type="submit" class="boton boton-principal">
          Enviar instrucciones
        </button>
      </form>

      <div id="mensaje-recuperar" class="resultado oculto" role="alert"></div>

      <p class="enlace-secundario">
        <a href="login.html"> Volver al inicio de sesión </a>
      </p>
    </section>
  </main>

  <script src="./js/datos.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/calculos.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/sesion.js"></script>
  <script src="./js/auth.js"></script>
</body>

</html>
