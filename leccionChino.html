<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lección de Chino | LingoWeb</title>
    <link rel="stylesheet" href="css/estilos-rem.css">
    <link rel="stylesheet" href="css/estilos-flex.css">
    <link rel="stylesheet" href="css/estilos-responsive.css">
</head>

<body>

    <header class="encabezado-leccion">

        <a href="cursoChino.html" aria-label="Salir de la lección">
            ✕
        </a>

        <div class="progreso-leccion">
            <span>Lección 1 (0%)</span>
            <strong>0 / 5</strong>
            <progress class="barra-progreso" value="0" max="100" aria-label="Progreso de la lección">0%</progress>
        </div>

        <div class="vidas" aria-label="Vidas restantes">
            ❤️❤️❤️
        </div>

    </header>

    <main class="contenedor-leccion">

        <section class="ejercicio">

            <div class="contenido-ejercicio">

                <p class="etiqueta-seccion">
                    CHINO MANDARÍN
                </p>

                <h1>
                    Traduce la siguiente oración:
                </h1>

                <p class="frase">
                    "你好，你好吗？"
                </p>
                <button type="button" class="boton-audio" aria-label="Escuchar la frase en chino">🔊 Escuchar</button>

                <div class="respuesta">
                    [ Hola ] [ ¿cómo estás? ]
                </div>

                <hr>

                <div class="banco-palabras">
                    <p>Banco de palabras disponibles:</p>
                    <ul class="lista-palabras">
                        <li><button type="button" class="boton">Hola</button></li>
                        <li><button type="button" class="boton">días</button></li>
                        <li><button type="button" class="boton">estás?</button></li>
                        <li><button type="button" class="boton">Gracias</button></li>
                        <li><button type="button" class="boton">¿cómo</button></li>
                        <li><button type="button" class="boton">Buenos</button></li>
                        <li><button type="button" class="boton">Adiós</button></li>
                    </ul>
                </div>

            </div>

            <footer class="acciones-ejercicio">

                <button type="button">
                    Comprobar Respuesta
                </button>

            </footer>

        </section>

    </main>

</body>

</html>
