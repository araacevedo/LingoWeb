<!--
curso.html es el mapa del curso, la vista 3. La diferencia es que ahora es una sola página que sirve para los tres idiomas. 
Antes había tres páginas fijas (cursoIngles.html, cursoAleman.html y cursoChino.html), cada una con su contenido escrito a mano
La consigna pide: “Presentación dinámica de la información” dice que el contenido “deberá construirse a partir de la información 
que administra la aplicación, y no quedar fijado individualmente en cada pantalla”, para “reutilizar las mismas vistas con distintos datos”.
-->

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- TP2: curso.js cambia el título por el del curso elegido -->
  <title>LingoWeb - Curso</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/card.css" />
  <link rel="stylesheet" href="css/forms-buttons.css" />
  <link rel="stylesheet" href="css/footer.css" />
</head>

<!-- TP2: esta página reemplaza a cursoIngles.html, cursoAleman.html y cursoChino.html.
     Es UNA sola página para los tres cursos: el curso se elige con la dirección,
     por ejemplo curso.html?curso=ingles, y curso.js arma el contenido con esos datos. -->

<body>

  <header class="barra-navegacion">
    <a href="dashboard.html" class="logo">LingoWeb</a>

    <input type="checkbox" id="menu-toggle" class="menu-toggle" />
    <label for="menu-toggle" class="boton-hamburguesa" aria-label="Abrir menú de navegación">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <nav aria-label="Navegación principal">
      <a href="dashboard.html" class="activo">Cursos</a>
      <a href="perfil.html">Perfil</a>
      <a href="ranking.html">Clasificación</a>
      <a href="tienda.html">Tienda / Rachas</a>
      <a href="login.html" class="enlace-salir">Salir</a>
    </nav>
  </header>

  <main class="mapa-curso">

    <section class="cabecera-curso">
      <a href="dashboard.html" class="volver">← Volver a Cursos</a>
      <p class="etiqueta-seccion">CURSO DE IDIOMAS</p>
      <!-- TP2: curso.js completa el nombre del curso, el avance y la unidad actual -->
      <h1 id="titulo-curso">Curso</h1>
      <p id="resumen-curso"></p>
    </section>

    <!-- TP2: curso.js agrega acá arriba una sección por cada unidad del curso, con sus lecciones -->

    <!-- TP2: valoraciones y comentarios del curso -->
    <section class="unidad" id="opiniones">
      <h2>Opiniones del curso</h2>
      <p id="promedio-opiniones"></p>

      <!-- TP2: curso.js arma la lista con las opiniones guardadas de este curso -->
      <ul class="lista-opiniones" id="lista-opiniones"></ul>

      <h3>Deja tu opinión</h3>
      <form id="form-opinion" novalidate>
        <fieldset class="campo estrellas">
          <legend>Calificación:</legend>
          <div class="opciones-estrellas">
            <label><input type="radio" name="estrellas" id="estrella-1" value="1" /> 1 ★</label>
            <label><input type="radio" name="estrellas" value="2" /> 2 ★</label>
            <label><input type="radio" name="estrellas" value="3" /> 3 ★</label>
            <label><input type="radio" name="estrellas" value="4" /> 4 ★</label>
            <label><input type="radio" name="estrellas" value="5" /> 5 ★</label>
          </div>
        </fieldset>

        <div class="campo">
          <label for="comentario">Comentario:</label>
          <textarea id="comentario" rows="3" maxlength="300" placeholder="¿Qué te pareció el curso?"></textarea>
        </div>

        <button type="submit" class="boton boton-principal">Publicar opinión</button>
      </form>

      <div id="mensaje-opinion" class="resultado oculto" role="alert"></div>
    </section>

  </main>

  <!-- TP2: controlador de esta vista (módulo) -->
  <script type="module" src="./js/presentacion/curso.js"></script>
</body>

</html>
