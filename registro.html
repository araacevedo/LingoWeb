<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | LingoWeb</title>
    <link rel="stylesheet" href="css/estilos-rem.css">
    <link rel="stylesheet" href="css/estilos-flex.css">
    <link rel="stylesheet" href="css/estilos-responsive.css">
</head>

<body>

    <header class="encabezado">

        <div class="marca">

            <div class="imagotipo">
                LW
            </div>

            <div>
                <h1>LingoWeb</h1>
                <p>Aprende idiomas de forma divertida</p>
            </div>

        </div>

    </header>


    <main class="contenedor">

        <section class="tarjeta">

            <h2>Crear una cuenta</h2>

            <p class="texto-bienvenida">
                Regístrate en LingoWeb y comienza a aprender idiomas.
            </p>

            <!-- Agregamos los atributos para validar la estructura[cite: 5] -->
            <form action="login.html" method="POST">

                <div class="campo">

                    <label for="nombre">
                        Nombre completo:
                    </label>

                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

                </div>


                <div class="campo">

                    <label for="usuario">
                        Usuario:
                    </label>

                    <input type="text" id="usuario" name="usuario" placeholder="Elige un usuario" required>

                </div>


                <div class="campo">

                    <label for="email">
                        Email:
                    </label>

                    <input type="email" id="email" name="email" placeholder="tu@email.com" required>

                </div>


                <div class="campo">

                    <label for="password">
                        Contraseña:
                    </label>

                    <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>

                </div>


                <div class="campo">

                    <label for="confirmar-password">
                        Confirmar contraseña:
                    </label>

                    <input type="password" id="confirmar-password" name="confirmar-password"
                        placeholder="Repite tu contraseña" required>

                </div>


                <button type="submit" class="boton boton-principal">
                    Crear cuenta
                </button>

            </form>


            <p class="enlace-secundario">

                ¿Ya tienes una cuenta?

                <a href="login.html">
                    Inicia sesión aquí
                </a>

            </p>

        </section>

    </main>

</body>

</html>
