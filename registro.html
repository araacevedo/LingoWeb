<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrarse | LingoWeb</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/card.css" />
  <link rel="stylesheet" href="css/forms-buttons.css" />
  <link rel="stylesheet" href="css/footer.css" />
</head>

<body>
  <header class="encabezado">
    <div class="marca">
      <div class="imagotipo">LW</div>

      <div>
        <h1>LingoWeb</h1>
        <p>Aprende idiomas de forma divertida</p>
      </div>
    </div>
  </header>

  <main class="contenedor">
    <section class="tarjeta">
      <h2>Crear una cuenta</h2>

      <p class="texto-bienvenida">
        Regístrate en LingoWeb y comienza a aprender idiomas.
      </p>

      <form id="form-registro">

        <div class="campo">
          <label for="nombre">Nombre completo:</label>
          <input type="text" id="nombre" placeholder="Tu nombre" required />
        </div>

        <div class="campo">
          <label for="usuario">Usuario:</label>
          <input type="text" id="usuario" placeholder="Elige un usuario" required />
        </div>

        <div class="campo">
          <label for="email">Email:</label>
          <input type="email" id="email" placeholder="tu@email.com" required />
        </div>

        <div class="campo">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" placeholder="Crea una contraseña" required />
        </div>

        <div class="campo">
          <label for="confirmar-password">Confirmar contraseña:</label>
          <input type="password" id="confirmar-password" placeholder="Repite tu contraseña" required />
        </div>

        <button type="submit" class="boton boton-principal">
          Crear cuenta
        </button>
      </form>

      <div id="mensaje-registro" class="resultado oculto" role="alert"></div>

      <p class="enlace-secundario">
        <a href="login.html">Volver al inicio de sesión</a>
      </p>
    </section>
  </main>

  <script src="./js/datos.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/calculos.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/sesion.js"></script>
  <script src="./js/auth.js"></script>
</body>

</html>
