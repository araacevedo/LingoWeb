<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrarse | LingoWeb</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/card.css" />
  <link rel="stylesheet" href="css/forms-buttons.css" />
  <link rel="stylesheet" href="css/footer.css" />
</head>

<body>
  <header class="encabezado">
    <div class="marca">
      <div class="imagotipo">LW</div>

      <div>
        <h1>LingoWeb</h1>
        <p>Aprende idiomas de forma divertida</p>
      </div>
    </div>
  </header>

  <main class="contenedor">
    <section class="tarjeta">
      <h2>Crear una cuenta</h2>

      <p class="texto-bienvenida">
        Regístrate en LingoWeb y comienza a aprender idiomas.
      </p>

      <form id="form-registro" novalidate> <!-- TP2: novalidate le dice al navegador: “no revises vos este formulario, de eso se encarga nuestro JavaScript”. -->
        
        <div class="campo">
          <label for="nombre">Nombre completo:</label>
          <input type="text" id="nombre" placeholder="Tu nombre" required />
        </div>

        <div class="campo">
          <label for="usuario">Usuario:</label>
          <input type="text" id="usuario" autocomplete="username" placeholder="Elige un usuario" required />
        </div>

        <div class="campo">
          <label for="email">Email:</label>
          <input type="email" id="email" autocomplete="email" placeholder="tu@email.com" required />
        </div>

        <div class="campo">
          <label for="contraseña">Contraseña:</label>
          <input type="password" id="contraseña" autocomplete="new-password" placeholder="Crea una contraseña" required />
        </div>

        <div class="campo">
          <label for="confirmarContraseña">Confirmar contraseña:</label>
          <input type="password" id="confirmarContraseña" autocomplete="new-password" placeholder="Repite tu contraseña" required />
        </div>

        <button type="submit" class="boton boton-principal">
          Crear cuenta
        </button>
      </form>

      <div id="mensaje-registro" class="resultado oculto" role="alert"></div>

      <p class="enlace-secundario">
        <a href="login.html">Volver al inicio de sesión</a>
      </p>
    </section>
  </main>

  <!-- TP2: cargamos UN solo módulo, el controlador de esta vista. type="module" habilita import/export:
       el navegador descarga solo los archivos que ese controlador importa (y los que importan ellos),
       en el orden correcto. Los módulos se ejecutan cuando el HTML terminó de cargarse. -->
  <script type="module" src="./js/presentacion/registro.js"></script>
</body>

</html>
