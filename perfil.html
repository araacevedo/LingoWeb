<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | LingoWeb</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header class="encabezado-principal">

        <nav aria-label="Navegación principal">

            <a href="dashboard.html">
                Cursos
            </a>

            <a href="perfil.html" class="activo">
                Perfil
            </a>

            <a href="ranking.html">
                Clasificación
            </a>

            <a href="tienda.html">
                Tienda / Rachas
            </a>

        </nav>

    </header>


    <main class="contenedor-perfil">

        <section class="cabecera-perfil">

            <div class="avatar">
                FL
            </div>

            <h1>
                Felipe Lavín
            </h1>

            <p>
                @felipe
            </p>

            <p>
                felipe@lingoweb.edu
            </p>

        </section>


        <section class="ajustes">

            <h2>
                Ajustes de cuenta
            </h2>


            <form>

                <div class="campo">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input type="text" id="usuario" name="usuario" value="felipe">

                </div>


                <div class="campo">

                    <label for="email">
                        Email institucional
                    </label>

                    <input type="email" id="email" name="email" value="felipe@lingoweb.edu">

                </div>


                <div class="campo">

                    <label for="password">
                        Nueva contraseña
                    </label>

                    <input type="password" id="password" name="password">

                </div>


                <div class="campo">

                    <label for="idioma">
                        Idioma de interfaz
                    </label>

                    <select id="idioma" name="idioma">

                        <option value="es" selected>
                            Español
                        </option>

                        <option value="en">
                            English
                        </option>

                    </select>

                </div>


                <button type="submit">
                    Guardar cambios
                </button>

            </form>

        </section>


        <section class="logros">

            <h2>
                Mis logros
            </h2>

            <div class="estadistica">

                <span>
                    ⚡ XP acumulados
                </span>

                <strong>
                    350 XP
                </strong>

            </div>

            <div class="estadistica">

                <span>
                    🔥 Racha actual
                </span>

                <strong>
                    5 días
                </strong>

            </div>

            <div class="estadistica">

                <span>
                    🏆 Liga
                </span>

                <strong>
                    Bronce
                </strong>

            </div>

        </section>


        <section class="cerrar-sesion">

            <a href="login.html">
                Cerrar sesión
            </a>

        </section>

    </main>

</body>

</html>
