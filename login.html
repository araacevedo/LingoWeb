<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LingoWeb - Iniciar sesión</title>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/card.css" />
    <link rel="stylesheet" href="css/forms-buttons.css" />
    <link rel="stylesheet" href="css/footer.css" />
</head>

<body>

    <header class="encabezado">

        <div class="marca">
            <!--Usamos un div porque necesitamos simplemente agrupar, pero no se representa un contenido semantico distinto-->
            <div class="imagotipo">LW</div>

            <div>
                <h1>LingoWeb</h1>
                <p>Aprende Inglés, Alemán y Chino gratis y de forma divertida</p>
            </div>
        </div>

    </header>


    <main class="contenedor">

        <section class="tarjeta">

            <h2>Iniciar sesión</h2>

            <p class="texto-bienvenida">
                Continúa tu aprendizaje de idiomas
            </p>

            <form id="form-login" novalidate> <!-- TP2: novalidate -->
            
            <div class="campo">
              <label for="identificador">Usuario / Email:</label>
              <input type="text" id="identificador" autocomplete="username" placeholder="Ingresa tu usuario o email" required />
            </div>

            <div class="campo">
              <label for="contraseña">Contraseña:</label>
              <input type="password" id="contraseña" autocomplete="current-password" placeholder="Ingresa tu contraseña" required />
            </div>

            <p class="enlace-olvido">
              <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
            </p>

            <button type="submit" class="boton boton-principal">
              Iniciar sesión
            </button>

          </form>

          <div id="mensaje-login" class="resultado oculto" role="alert"></div> <!-- TP2: contenedor que llena presentacion/ui.js; role="alert" hace que el lector de pantalla lea el mensaje -->

          <div class="registro">
            <p>
              ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
          </div>

          <!-- TP2: datos de las cuentas definidas en js/datos/usuarios.js -->
          <p class="texto-bienvenida">Cuentas de demostración: pedro / demo123 · ana / demo123</p>

        </section>

    </main>

    <!-- TP2: cargamos UN solo módulo, el controlador de esta vista. type="module" habilita import/export:
       el navegador descarga solo los archivos que ese controlador importa (y los que importan ellos),
       en el orden correcto. Los módulos se ejecutan cuando el HTML terminó de cargarse. -->
  <script type="module" src="./js/presentacion/login.js"></script>

</body>

</html>
