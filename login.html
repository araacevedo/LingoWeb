<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LingoWeb - Iniciar sesión</title>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/card.css" />
    <link rel="stylesheet" href="css/forms-buttons.css" />
    <link rel="stylesheet" href="css/footer.css" />
</head>

<body>

    <header class="encabezado">

        <div class="marca">
            <!--Usamos un div porque necesitamos simplemente agrupar, pero no se representa un contenido semantico distinto-->
            <div class="imagotipo">LW</div>

            <div>
                <h1>LingoWeb</h1>
                <p>Aprende Inglés, Alemán y Chino gratis y de forma divertida</p>
            </div>
        </div>

    </header>


    <main class="contenedor">

        <section class="tarjeta">

            <h2>Iniciar sesión</h2>

            <p class="texto-bienvenida">
                Continúa tu aprendizaje de idiomas
            </p>


            <form id="form-login">
            
            <div class="campo">
              <label for="identificador">Usuario / Email:</label>
              <input type="text" id="identificador" placeholder="Ingresa tu usuario o email" required />
            </div>

            <div class="campo">
              <label for="password">Contraseña:</label>
              <input type="password" id="password" placeholder="Ingresa tu contraseña" required />
            </div>

            <p class="enlace-olvido">
              <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
            </p>

            <button type="submit" class="boton boton-principal">
              Iniciar sesión
            </button>

          </form>

          <div id="mensaje-login" class="resultado oculto" role="alert"></div>

          <div class="registro">
            <p>
              ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
          </div>

        </section>

    </main>

    <script src="./js/datos.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/calculos.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/sesion.js"></script>
    <script src="./js/auth.js"></script>

</body>

</html>
