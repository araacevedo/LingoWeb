<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lección de Inglés | LingoWeb</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/card.css" />
    <link rel="stylesheet" href="css/forms-buttons.css" />
    <link rel="stylesheet" href="css/footer.css" />
  </head>

  <body>
    <header class="encabezado-leccion">
      <a href="cursoIngles.html" aria-label="Salir de la lección"> ✕ </a>

      <div class="progreso-leccion">
        <span id="numero-ejercicio">Ejercicio 1 de 3</span>
        <strong id="progreso-texto">1 / 3</strong>

        <progress
          id="barra-progreso"
          value="1"
          max="3"
          aria-label="Avance de la lección"
        >
          1 de 3
        </progress>
      </div>

      <div class="vidas" aria-label="Vidas restantes">❤️❤️❤️</div>
    </header>

    <main class="contenedor-leccion" data-curso="ingles" data-leccion="l1">
      <section class="ejercicio" id="ejercicio">
        <div class="contenido-ejercicio">
          <p class="etiqueta-seccion">INGLÉS</p>

          <h1>Traduce la siguiente oración:</h1>

          <p class="frase" id="frase"></p>
          <audio
            class="audio-frase"
            controls
            preload="none"
            aria-label="Escuchar la frase en inglés"
          >
            <source id="audio-ejercicio" src="" type="audio/mpeg" />
            Tu navegador no admite audio.
          </audio>
          <div class="respuesta" id="respuesta" aria-label="Tu respuesta"></div>

          <hr />
          <div class="banco-palabras">
            <p>Banco de palabras disponibles:</p>
            <ul class="lista-palabras" id="banco-palabras"></ul>
          </div>
        </div>

        <footer class="acciones-ejercicio">
          <button
            type="button"
            id="comprobar-respuesta"
            class="boton boton-principal"
          >
            Comprobar respuesta
          </button>
        </footer>

        <p id="mensaje-resultado" role="status" aria-live="polite"></p>
        <!-- permite que los lectores de pantalla anuncien el resultado de la comprobación de la respuesta -->
        <!-- Se muestra únicamente cuando la respuesta es correcta. -->
        <button
          type="button"
          id="continuar-leccion"
          class="boton boton-principal"
          hidden
        >
          Continuar
        </button>
      </section>
    </main>

    <script type="module" src="./js/presentacion/leccionIngles.js"></script>
  </body>
</html>
