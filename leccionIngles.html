<body>

    <header class="encabezado-leccion">

        <a href="cursoIngles.html" aria-label="Salir de la lección">
            ✕
        </a>

        <div class="progreso-leccion">
            <span>Lección 2</span>
            <strong>2 / 5</strong>
        </div>

        <div class="vidas" aria-label="Vidas restantes">
            ❤️❤️❤️
        </div>

    </header>

    <main class="contenedor-leccion">

        <section class="ejercicio">

            <div class="contenido-ejercicio">

                <p class="etiqueta-seccion">
                    INGLÉS
                </p>

                <h1>
                    Traduce la siguiente oración:
                </h1>

                <p class="frase">
                    "Good morning, how are you?"
                </p>

                <div class="respuesta">
                    [ Buenos ] [ días ] [ ¿cómo ] [ estás? ]
                </div>

                <hr>
                <div class="banco-palabras">
                    <p>Banco de palabras disponibles:</p>
                    <ul class="lista-palabras">
                        <li><button type="button" class="boton">Hola</button></li>
                        <li><button type="button" class="boton">días</button></li>
                        <li><button type="button" class="boton">estás?</button></li>
                        <li><button type="button" class="boton">Gracias</button></li>
                        <li><button type="button" class="boton">¿cómo</button></li>
                        <li><button type="button" class="boton">Buenos</button></li>
                        <li><button type="button" class="boton">Adiós</button></li>
                    </ul>
                </div>

            </div>

            <footer class="acciones-ejercicio">

                <button type="button">
                    Comprobar Respuesta
                </button>

            </footer>

        </section>

    </main>

</body>
